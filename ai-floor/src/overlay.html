<title>ぷらかん AI フロア</title>
<style>
  :root{
    --ink:#1e242c; --sub:#69727d;
    --panel:rgba(252,253,254,0.86);
    --panel-brd:rgba(255,255,255,0.9);
    --shadow:0 14px 44px rgba(20,28,40,0.22);
    --furusato:#d88a4a; --keiri:#35b87a; --design:#8b6fd8;
    --ceo:#d88a4a; --data:#3d8bd6; --cafe:#7f8794;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#2a2f38}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  .ui{position:fixed;z-index:10;pointer-events:none}
  .panel{
    background:var(--panel);border:1px solid var(--panel-brd);
    border-radius:18px;box-shadow:var(--shadow);
    backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  }

  /* title */
  .titlecard{top:22px;left:22px;padding:18px 24px 16px;display:flex;gap:16px;align-items:center}
  .mark{width:46px;height:58px;flex:none}
  .eyebrow{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--sub);font-weight:700;display:flex;align-items:center;gap:8px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--furusato);
    box-shadow:0 0 0 4px rgba(232,115,74,.18)}
  .titlecard h1{
    font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.1;margin-top:8px;
  }
  .titlecard p{margin-top:6px;font-size:13px;color:var(--sub);font-weight:600}

  /* legend */
  .legend{bottom:22px;left:22px;padding:16px 20px}
  .legend h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);
    font-weight:700;margin-bottom:12px}
  .legend ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
  .legend li{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650;white-space:nowrap}
  .legend .sw{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}

  /* hint */
  .hint{bottom:22px;right:22px;padding:12px 18px;display:flex;gap:18px;align-items:center}
  .hint span{font-size:12.5px;color:var(--sub);font-weight:650;display:flex;align-items:center;gap:7px}
  .hint .ico{width:22px;height:22px;border-radius:6px;background:rgba(60,72,90,.09);
    display:grid;place-items:center;font-size:12px}

  /* loader */
  #loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:linear-gradient(160deg,#eaf1f8,#dbe6f0);transition:opacity .6s ease}
  #loader .l-inner{text-align:center}
  #loader .ring{width:46px;height:46px;border-radius:50%;margin:0 auto 16px;
    border:4px solid rgba(90,110,140,.2);border-top-color:var(--furusato);
    animation:spin 1s linear infinite}
  #loader p{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--sub);font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#loader .ring{animation:none}}

  @media (max-width:640px){
    .titlecard h1{font-size:23px}
    .legend ul{grid-template-columns:1fr}
    .hint{display:none}
  }
</style>

<div id="app"></div>

<div id="loader"><div class="l-inner"><div class="ring"></div><p>Building the floor…</p></div></div>

<div class="ui titlecard panel">
  <svg class="mark" viewBox="0 0 100 126" aria-hidden="true">
    <rect x="14" y="16" width="72" height="96" rx="8" fill="#cf8a52"/>
    <ellipse cx="50" cy="16" rx="36" ry="11" fill="#e2ab7c"/>
    <ellipse cx="50" cy="16" rx="28" ry="7" fill="#f3ddc7"/>
    <rect x="20" y="62" width="60" height="40" rx="5" fill="#fff"/>
    <rect x="37" y="68" width="26" height="27" rx="6" fill="#cf8a52"/>
    <text x="50" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="23" fill="#fff">P</text>
  </svg>
  <div>
    <div class="eyebrow"><span class="dot"></span>purakan · Virtual AI Office</div>
    <h1>ぷらかん AI フロア</h1>
    <p>オープンワークフロア10席・PM席・社長室・中央水槽</p>
  </div>
</div>

<div class="ui legend panel">
  <h2>Floor Guide</h2>
  <ul>
    <li><span class="sw" style="background:var(--furusato)"></span>ワークフロア 10席</li>
    <li><span class="sw" style="background:var(--data)"></span>PM 席</li>
    <li><span class="sw" style="background:var(--ceo)"></span>ぷらかん 社長室</li>
    <li><span class="sw" style="background:var(--cafe)"></span>カフェ / 仮眠</li>
  </ul>
</div>

<div class="ui hint panel">
  <span><span class="ico">🖱</span>ドラッグで回転</span>
  <span><span class="ico">⚲</span>ホイールでズーム</span>
</div>
